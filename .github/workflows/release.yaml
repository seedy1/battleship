name: Release Battleship App

on:
  workflow_run:
    workflows: ["Build JavaFX"]
    types:
      - completed
  push:
    tags:
      - 'v*'  # Trigger only when a tag starting with v is pushed

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven  and create runtime image
        run: |
          mvn clean package
          mvn javafx:jlink
          cd target
          zip -r batlleship.zip batlleship

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./target/batlleship-1.0-SNAPSHOT.jar
          asset_name: battleship-${{ github.ref_name }}.jar
          asset_content_type: application/java-archive

      - name: Finding JAR file
        id: find_jar
        run: echo "JAR_PATH=$(find target -name "*.jar" | head -n 1)" >> $GITHUB_ENV

      - name: Upload Runtime Image to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.JAR_PATH }}
          asset_name: battleship-${{ github.ref_name }}.zip
          asset_content_type: application/zip